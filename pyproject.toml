[project]
name = "guitarai"
version = "0.1.0"
description = "Guitar chord recognition"
readme = "README.md"
requires-python = ">=3.8.18"
dependencies = [
    "librosa>=0.11.0",
    "sounddevice>=0.5.6",
    "pyyaml>=6.0",
]

[project.scripts]
guitarai-record = "record_data:main"
guitarai-live = "live_detect:main"
